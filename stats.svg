<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none" role="img" aria-label="Currently building">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="scard"><rect x="0" y="0" width="1200" height="210" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#scard)">
    <rect width="1200" height="210" fill="url(#sbg)"/>

    <!-- title -->
    <text x="600" y="46" text-anchor="middle"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
          font-size="20" font-weight="700" letter-spacing="5" fill="#ffffff">CURRENTLY BUILDING</text>
    <!-- animated accent underline -->
    <rect x="450" y="58" width="300" height="2" fill="url(#accent)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Tile 1 -->
    <g>
      <rect x="40" y="82" width="353" height="96" rx="10" fill="url(#tile)" stroke="#30363d" stroke-width="1"/>
      <text x="216" y="122" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#ffffff">SYSTEMS &amp; APIs</text>
      <text x="216" y="150" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="1" fill="#b0b3c2">backend that scales</text>
    </g>

    <!-- Tile 2 -->
    <g>
      <rect x="423" y="82" width="354" height="96" rx="10" fill="url(#tile)" stroke="#30363d" stroke-width="1"/>
      <text x="600" y="122" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#ffffff">INFRASTRUCTURE</text>
      <text x="600" y="150" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="1" fill="#b0b3c2">cloud &#183; k8s &#183; IaC</text>
    </g>

    <!-- Tile 3 -->
    <g>
      <rect x="807" y="82" width="353" height="96" rx="10" fill="url(#tile)" stroke="#30363d" stroke-width="1"/>
      <text x="983" y="122" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#ffffff">DISTRIBUTED</text>
      <text x="983" y="150" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="1" fill="#b0b3c2">low-latency &#183; resilient</text>
    </g>

    <!-- blinking cursor accents -->
    <rect x="150" y="112" width="8" height="2" fill="#ffffff"><animate attributeName="opacity" values="0;0;1;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
